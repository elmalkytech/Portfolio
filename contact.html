    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        body {
            min-height: 100vh;
            margin: 0;
        }


        /* =====================================================
           LANGUAGE SWITCH
           ===================================================== */

        .form-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /*
         * Switch container
         */

        #languageSwitchContainer {
            position: relative;

            width: 42px;
            height: 22px;

            display: block;

            flex-shrink: 0;

            cursor: pointer;
        }


        /*
         * Hide real checkbox
         */

        #languageSwitch {
            position: absolute;

            width: 1px;
            height: 1px;

            opacity: 0;

            pointer-events: none;
        }


        /*
         * Switch background
         */

        #languageSwitchContainer::before {

            content: "";

            position: absolute;

            inset: 0;

            background: #555;

            border-radius: 20px;

            transition:
                background 0.3s ease;

        }


        /*
         * Switch button
         */

        #languageSwitchContainer::after {

            content: "";

            position: absolute;

            width: 16px;
            height: 16px;

            left: 3px;
            top: 3px;

            background: #fff;

            border-radius: 50%;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.35s cubic-bezier(.4, 0, .2, 1);

        }


        /*
         * Arabic / ON position
         */

        #languageSwitchContainer.active::after {

            transform: translateX(20px);

        }


        /*
         * Arabic background
         */

        #languageSwitchContainer.active::before {

            background: #777;

        }


        /*
         * Language text
         */

        #languageLabel {

            display: inline-block;

            min-width: 28px;

            color: #ddd;

            font-size: 14px;

            font-weight: 600;

            line-height: 22px;

            text-align: center;

            cursor: pointer;

            user-select: none;

            opacity: 1;

            transform: translateY(0);

        }


        /* =====================================================
           CONTACT LANGUAGE ANIMATION
           ===================================================== */

        /*
         * IMPORTANT:
         * Only the contact content is animated.
         *
         * The navbar, switch and language label stay still.
         */

        #contactContent.language-changing {

            animation:
                contactLanguageChange 0.55s
                cubic-bezier(.4, 0, .2, 1);

        }


        @keyframes contactLanguageChange {

            0% {

                opacity: 1;

                transform:
                    translateY(0);

            }

            45% {

                opacity: 0;

                transform:
                    translateY(-10px);

            }

            100% {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           CONTACT CONTENT
           ===================================================== */

        .contact-container {

            will-change:
                opacity,
                transform;

        }


        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                transition-duration:
                    0.01ms !important;

            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            #languageSwitchContainer {

                width: 40px;
                height: 21px;

            }

            #languageSwitchContainer::after {

                width: 15px;
                height: 15px;

                left: 3px;
                top: 3px;

            }

            #languageSwitchContainer.active::after {

                transform: translateX(19px);

            }

        }

    </style>

    <!-- =====================================================
         LANGUAGE JAVASCRIPT
         ===================================================== -->

    <script>

        /*
         * Get elements
         */

        const languageSwitch =
            document.getElementById(
                "languageSwitch"
            );


        const languageSwitchContainer =
            document.getElementById(
                "languageSwitchContainer"
            );


        const languageLabel =
            document.getElementById(
                "languageLabel"
            );


        const contactContent =
            document.getElementById(
                "contactContent"
            );


        /*
         * Get saved language.
         *
         * Default = English
         */

        let currentLanguage =
            localStorage.getItem(
                "elmalkyLanguage"
            ) || "en";



        /* =====================================================
           LANGUAGE ANIMATION
           ===================================================== */

        function restartLanguageAnimation() {

            /*
             * Remove previous animation
             */

            contactContent.classList.remove(
                "language-changing"
            );


            /*
             * Force browser reflow.
             *
             * This allows the animation to restart
             * every single time.
             */

            void contactContent.offsetWidth;


            /*
             * Start animation
             */

            contactContent.classList.add(
                "language-changing"
            );


            /*
             * Clean up after animation
             */

            setTimeout(function () {

                contactContent.classList.remove(
                    "language-changing"
                );

            }, 600);

        }



        /* =====================================================
           APPLY LANGUAGE
           ===================================================== */

        function applyLanguage(
            language,
            animate = false
        ) {

            currentLanguage =
                language;


            const isArabic =
                language === "ar";


            /*
             * Save language
             */

            localStorage.setItem(
                "elmalkyLanguage",
                language
            );


            /*
             * Update HTML language
             */

            document.documentElement.lang =
                language;


            /*
             * Update direction
             */

            document.documentElement.dir =
                isArabic
                    ? "rtl"
                    : "ltr";


            /*
             * Translate everything
             * containing data-en/data-ar
             */

            document
                .querySelectorAll(
                    "[data-en][data-ar]"
                )
                .forEach(function (element) {

                    element.textContent =
                        isArabic
                            ? element.getAttribute(
                                "data-ar"
                              )
                            : element.getAttribute(
                                "data-en"
                              );

                });


            /*
             * Update checkbox
             */

            languageSwitch.checked =
                isArabic;


            /*
             * Move switch
             */

            languageSwitchContainer.classList.toggle(
                "active",
                isArabic
            );


            /*
             * Change label
             *
             * English page:
             * AR
             *
             * Arabic page:
             * EN
             */

            languageLabel.textContent =
                isArabic
                    ? "EN"
                    : "AR";


            /*
             * Make sure label is always visible
             */

            languageLabel.style.opacity =
                "1";

            languageLabel.style.transform =
                "translateY(0)";


            /*
             * Animate ONLY the contact content
             */

            if (animate) {

                restartLanguageAnimation();

            }

        }



        /* =====================================================
           LANGUAGE SWITCH EVENT
           ===================================================== */

        languageSwitch.addEventListener(
            "change",
            function () {

                const newLanguage =
                    this.checked
                        ? "ar"
                        : "en";


                applyLanguage(
                    newLanguage,
                    true
                );

            }
        );



        /* =====================================================
           INITIALIZE LANGUAGE
           ===================================================== */

        applyLanguage(
            currentLanguage,
            false
        );

    </script>
